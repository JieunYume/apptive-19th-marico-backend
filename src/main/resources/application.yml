spring:
  config:
    import:
      - optional:classpath:/application-jwt-secret.yml
      - optional:classpath:/application-s3.yml
      - optional:classpath:/application-db.yml
      - optional:classpath:/application-mail.yml
#  h2:
#    console:
#      enabled: true
#  datasource:
#    url: jdbc:mysql://127.0.0.1:3310/marico
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    username: root
#    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
logging:
  level:
    root: Info


management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true

server:
  port: 8080
