spring:
  config:
    import:
      - optional:classpath:/application-jwt-secret.yml
      - optional:classpath:/application-s3.yml
      - optional:classpath:/application-mail.yml
      - optional:classpath:/application-kakaopay.yml
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: maricobucket
    stack:
      auto: false

logging:
  level:
    root: Info

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true

server:
  port: 8080
---
spring:
  config:
    activate:
      on-profile: "local"
    import:
      - optional:classpath:/application-db-local.yml
---
spring:
  config:
    activate:
      on-profile: "!local"
    import:
      - optional:classpath:/application-db.yml
